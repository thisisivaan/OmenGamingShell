name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          $csproj = Join-Path $env:GITHUB_WORKSPACE 'OmenGamingShell\OmenGamingShell.csproj'
          $xml = [xml](Get-Content $csproj)
          if ($xml.Project.PropertyGroup.Version) { $xml.Project.PropertyGroup.Version = $tag }
          $xml.Save($csproj)
          Write-Host "Set app version to $tag"

      - name: Publish (win-x64, self-contained, single file)
        run: dotnet publish .\OmenGamingShell\OmenGamingShell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmenGamingShell-win-x64
          path: OmenGamingShell\bin\Release\net8.0-windows\win-x64\publish\OmenGamingShell.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OmenGamingShell-win-x64
          path: release-assets

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/OmenGamingShell.exe --generate-notes
