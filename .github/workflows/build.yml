name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          $csproj = Join-Path $env:GITHUB_WORKSPACE 'OmenGamingShell\OmenGamingShell.csproj'
          $xml = [xml](Get-Content $csproj)
          if ($xml.Project.PropertyGroup.Version) { $xml.Project.PropertyGroup.Version = $tag }
          $xml.Save($csproj)
          Write-Host "Set app version to $tag"

      - name: Publish (win-x64, self-contained, single file)
        run: dotnet publish .\OmenGamingShell\OmenGamingShell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Smoke test (launch exe, fail on crash)
        shell: pwsh
        run: |
          $exe = 'OmenGamingShell\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\OmenGamingShell.exe'
          if (-not (Test-Path $exe)) { Write-Error "Missing $exe"; exit 1 }
          function Count-CrashEvents {
            $n = 0
            try {
              $n = (Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='.NET Runtime'} -MaxEvents 300 -ErrorAction Stop |
                    Where-Object { $_.Message -like '*OmenGamingShell.exe*' }).Count
            } catch { }
            return $n
          }
          $before = Count-CrashEvents
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          $after = Count-CrashEvents
          if ($alive) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "Smoke: alive=$([bool]$alive) crashLogsBefore=$before crashLogsAfter=$after"
          if (-not $alive -or $after -gt $before) {
            Write-Error 'Smoke test failed: published exe crashed on launch.'
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmenGamingShell-win-x64
          path: OmenGamingShell\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\OmenGamingShell.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OmenGamingShell-win-x64
          path: release-assets

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/OmenGamingShell.exe --generate-notes
